# git-cliff config: CHANGELOG.md sections and GitHub release notes, both built
# from conventional commit subjects. See `make release`.
[changelog]
body = """
{%- set host     = "https://github.com" -%}
{%- set repo_url = host ~ "/" ~ remote.github.owner ~ "/" ~ remote.github.repo -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% if previous.version %}[`{{ previous.version }}...{{ version }}`]({{ repo_url }}/compare/{{ previous.version }}...{{ version }})
{% endif %}
{% else -%}
## [unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | upper_first }}
{% for commit in commits -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} — {{ commit.author.timestamp | date(format="%Y-%m-%d") }} by {% if commit.remote.username %}[@{{ commit.remote.username }}]({{ host }}/{{ commit.remote.username }}){% else %}{{ commit.author.name }}{% endif %} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ repo_url }}/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# NOTE: breaking commits are matched first, so a `build!:` or `chore!:` -- types skipped below --
# still reaches the changelog instead of disappearing with the rest of its type.
commit_parsers = [
    { field = "breaking", pattern = "true", group = "Breaking Changes" },
    { message = "^feat",     group = "Features" },
    { message = "^fix",      group = "Bug Fixes" },
    { message = "^perf",     group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^deps",     group = "Dependencies" },
    { message = "^docs?",    group = "Documentation" },
    { message = "^chore",    skip = true },
    { message = "^ci",       skip = true },
    { message = "^test",     skip = true },
    { message = "^build",    skip = true },
]
filter_commits = true
# Tags up to 0.0.33 (cut by release-it) have no `v` prefix; `make release` writes `v<version>`.
tag_pattern = "v?[0-9].*"
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "izelnakri"
repo  = "memoria"
