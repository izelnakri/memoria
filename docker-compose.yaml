# Local development database for the SQLAdapter test suite.
#
# NOTE: this used to also build and run memoria itself in a container, because CI executed the suite
# inside docker-compose against a GHCR-hosted image. CI now runs the suite directly on the runner
# with a postgres service container, so the only thing worth containerising locally is the database.
#
#   docker compose up -d
#   npm test
#
# The credentials match the SQLAdapter defaults, so no environment variables are needed. Override
# with the standard libpq variables (PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE) if this clashes
# with a postgres you already run on 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
